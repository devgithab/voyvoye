<title>Voy Voye 🥙</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1d1b18;--mu:#7a746b;--ac:#ff5a1f;--ac2:#fff0e8;--bd:#ece7df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#201e1b;--tx:#f3efe9;--mu:#a39c91;--ac2:#3a2218;--bd:#2f2c28;color-scheme:dark}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:520px;margin:0 auto;padding-bottom:90px}
header{padding:16px 16px 8px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;position:sticky;top:60px;background:var(--bg);z-index:5}
.tab{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font:600 14px inherit;font-family:inherit}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sec{padding:6px 16px}
.sec h2{font-size:18px;margin:12px 0 8px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.em{flex:none;width:64px;height:64px;border-radius:14px;background:var(--ac2);display:grid;place-items:center;font-size:32px}
.inf{flex:1;min-width:0}
.inf b{font-size:15px}.inf p{font-size:12px;color:var(--mu);margin:2px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between}
.pr{font-weight:700}
.add{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:7px 14px;font:700 14px inherit;font-family:inherit}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:496px;background:var(--ac);color:#fff;border:0;border-radius:16px;padding:15px 18px;display:none;justify-content:space-between;font:700 16px inherit;font-family:inherit;z-index:10}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:20px;margin-bottom:4px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);font-size:15px}
.opt label{display:flex;gap:10px;align-items:center;flex:1}
.opt input{width:20px;height:20px;accent-color:var(--ac)}
.g{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;margin:14px 0 2px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
input.t{width:100%;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-top:8px;font-family:inherit}
.big{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:700 16px inherit;font-family:inherit}
.tot{display:flex;justify-content:space-between;padding:5px 0;color:var(--mu);font-size:14px}
.tot.f{color:var(--tx);font-weight:800;font-size:17px}
.x{float:right;border:0;background:var(--card);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:16px}

.hero{margin:0 16px;border-radius:20px;padding:16px;background:linear-gradient(135deg,#ff5a1f,#ff9a3c);color:#fff}
.hero b{font-size:15px}.hero p{font-size:12px;opacity:.9;margin-top:3px}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.auth .logo{font-size:64px;text-align:center}.auth h1{text-align:center;margin:6px 0 4px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:600 11px inherit;font-family:inherit;padding:6px}
.nav button.on{color:var(--ac)}.nav span{display:block;font-size:20px}
.pay{display:flex;gap:8px;margin-top:8px}.pay label{flex:1;border:2px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font-weight:700;background:var(--card)}
.pay input{display:none}.pay label.on{border-color:var(--ac);background:var(--ac2)}
.st{display:inline-block;padding:3px 10px;border-radius:10px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:700}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:14px;z-index:50;font-size:14px;display:none;max-width:90%}
svg.map{width:100%;border-radius:14px;background:var(--ac2);touch-action:manipulation}
.rt{display:flex;gap:6px;padding:8px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:8}.rt button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 13px inherit;font-family:inherit}.rt button.on{background:var(--tx);color:var(--bg)}.off{opacity:.45;filter:grayscale(1)}.mi{display:flex;gap:8px;align-items:center;margin-top:6px}.mi input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}.sm{border:0;border-radius:10px;padding:8px 10px;font:700 12px inherit;font-family:inherit;background:var(--ac2);color:var(--ac)}.sm.g{background:#e3f6e8;color:#1b7a36}.sm.r{background:#fde4e4;color:#c22}
:root[data-theme="dark"]{--bg:#141311;--card:#201e1b;--tx:#f3efe9;--mu:#a39c91;--ac2:#3a2218;--bd:#2f2c28;color-scheme:dark}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bar{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 300px at 90% -5%,rgba(255,90,31,.20),transparent),radial-gradient(380px 280px at -10% 40%,rgba(255,170,60,.12),transparent)}
.top{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tl{font-weight:800;font-size:17px;letter-spacing:-.3px}
.ctl{display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:3px}
.ctl button{border:0;background:none;color:var(--mu);font:700 12px inherit;font-family:inherit;padding:7px 9px;border-radius:10px;transition:.2s}
.ctl button.on{background:var(--ac);color:#fff}
#th{font-size:16px;color:var(--tx)}
.top{padding-top:calc(8px + env(safe-area-inset-top,0px))}
:root{padding-top:0!important}
.tabs{top:calc(env(safe-area-inset-top,0px) + 52px)!important}
.item{animation:up .45s both;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .15s,box-shadow .2s}
.item:active{transform:scale(.98)}
.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.1s}.item:nth-child(4){animation-delay:.15s}.item:nth-child(5){animation-delay:.2s}
.em{box-shadow:inset 0 0 0 1px rgba(255,90,31,.15);transition:transform .3s}.item:hover .em{transform:rotate(-8deg) scale(1.08)}
.add{transition:transform .12s,box-shadow .2s;box-shadow:0 4px 12px rgba(255,90,31,.35)}.add:active{transform:scale(.92)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff5a1f,#ff8a3c 60%,#ffb347);box-shadow:0 10px 28px rgba(255,90,31,.3);animation:up .5s both}
.hero::after{content:"🔥";position:absolute;right:14px;top:8px;font-size:52px;animation:fl 3s ease-in-out infinite}
.hero b{font-size:16px;display:block;max-width:75%}
.bar{animation:bar .3s both;box-shadow:0 10px 26px rgba(255,90,31,.45)}
.sheet{animation:up .3s both}
.tab{transition:.2s}.tab.on{box-shadow:0 4px 12px rgba(255,90,31,.35)}
.auth{min-height:calc(100vh - 60px)}
.auth img{animation:fl 3.2s ease-in-out infinite;box-shadow:0 12px 34px rgba(255,90,31,.4);border:3px solid var(--card)}
.big{box-shadow:0 8px 20px rgba(255,90,31,.35);transition:transform .12s}.big:active{transform:scale(.97)}
.cf{position:fixed;top:-30px;z-index:60;font-size:24px;animation:fall 2.4s ease-in forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ph{flex:none;width:84px;height:84px;border-radius:16px;object-fit:cover;background:var(--ac2)}
.nb{display:grid;place-items:center;color:var(--ac);opacity:.85}
.pcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;animation:up .4s both}
.av{flex:none;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#ff5a1f,#ffb347);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.big2{margin:10px auto}
.pn{flex:1;min-width:0}.bio{font-size:13px;color:var(--mu);margin-top:4px;white-space:pre-wrap;word-break:break-word}

.contest b{font-size:16px}.contest p{font-size:13px;opacity:.92;margin:4px 0 8px}.contest .st{background:rgba(255,255,255,.22);color:#fff}
.stars{margin-top:6px;display:flex;align-items:center;gap:2px}.sb{border:0;background:none;font-size:28px;color:#cfc8bd;padding:0 2px;line-height:1}.sb.on{color:#ffb400}
textarea.t,select.t{font-family:inherit}
.an{display:flex;gap:10px}

.cardbox{background:linear-gradient(135deg,#1f2937,#374151);color:#fff;border-radius:16px;padding:14px;margin-top:8px}
.cardbox .sub{color:#cbd5e1;margin:2px 0}.cn{font-size:20px;font-weight:800;letter-spacing:1.5px;margin:6px 0;font-variant-numeric:tabular-nums}
.rc{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin:6px 0}
